<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Profile</h1>
        <p class="subtitle">Enter student information below</p>

        <form id="studentForm">
            <label for="name">Student Name</label>
            <input type="text" id="name" required>

            <label for="roll">Roll Number</label>
            <input type="text" id="roll" required>

            <label for="section">Section</label>
            <input type="text" id="section" required>

            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required>

            <button type="submit">Generate Profile</button>
        </form>

        <div id="profile" class="profile-card" hidden>
            <h2>Student Details</h2>
            <p><strong>Name:</strong> <span id="showName"></span></p>
            <p><strong>Roll Number:</strong> <span id="showRoll"></span></p>
            <p><strong>Section:</strong> <span id="showSection"></span></p>
            <p><strong>Date of Birth:</strong> <span id="showDob"></span></p>
            <p><strong>Age:</strong> <span id="showAge"></span> years</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
